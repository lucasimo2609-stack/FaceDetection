name: Test e pubblicazione su GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test unitari
        run: npm test
      - name: Verifica integrità di MediaPipe e del modello
        run: |
          cd vendor/mediapipe
          sha256sum -c <<'EOF'
          de83c48ff329717a27aeb528d5ef5f47f077c628a5302dc483aca5b513e7464b  vision_bundle.mjs
          6f6b86509cf9e163ea1cfec7edc8cf53732699c04781e4c21c557c1ba402310e  wasm/vision_wasm_internal.js
          cb3ec20026a9aecc2a81a93c25630ceb5389297ddb7a5f0bd61dd09cde606b9b  wasm/vision_wasm_internal.wasm
          9f8fc960e363f0fb2f42f7937b97ae9cf9a5630490f71031fa90caa9bb121938  wasm/vision_wasm_nosimd_internal.js
          924274fcd5ac8985f6570a8573e7971b7bd2d580ba1b8f3beb0ba8f95db6347c  wasm/vision_wasm_nosimd_internal.wasm
          64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  ../../models/face_landmarker.task
          EOF

  deploy:
    # Pubblica solo dal ramo principale.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepara il sito statico
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js icons models vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
